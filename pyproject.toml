[project]
name = "pdelab"
version = "0.1.0"
description = "Physics-Constrained Neural Operator Research Prototype"
authors = [{ name = "Atul Pandey" }]
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "pyyaml",
    "h5py",
    "matplotlib",
    "tqdm",
    "pytest",
    "ruff",
    "psutil",
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "RUF012", # mutable class attributes are used deliberately in dataclasses
    "B008",   # function calls in argument defaults are used deliberately
    "B905",   # zip(strict=...) is not needed: the paired sequences are
              # constructed together and are always the same length
    "RUF007", # zip over successive pairs is clearer than itertools.pairwise
              # in the refinement-rate calculations
    "RUF046", # the explicit int(round(...)) documents the intent
    "RUF059", # unpacking a tuple whose extra members are unused
]

[tool.ruff.lint.per-file-ignores]
# Defensive catches around optional third-party behaviour (GPU queries,
# torch.compile hooks) are intentional and must not crash a run.
"src/pdelab/resources/preflight.py" = ["B904"]
"src/pdelab/evaluation/rollout.py" = ["B904"]
"src/pdelab/benchmarks/variant_runner.py" = ["B904"]
"src/pdelab/benchmarks/inference.py" = ["B904"]
"src/pdelab/training/experiment.py" = ["B904"]
"src/pdelab/reporting/plots.py" = ["B904"]
