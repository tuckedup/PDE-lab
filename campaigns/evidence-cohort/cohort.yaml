# Declared evidence cohort for the PDELab target table.
#
# A target is evaluated ONLY against a cohort that is declared here.
# The cohort is the frozen matrix: which runs count, which dataset they
# must have been computed on, which evaluator implementation and
# protocol they must have used, and which settings were resolved.
#
# Rules enforced by src/pdelab/reporting/report.py:
#
#   * A run that is not listed in a member's `run_ids`, or whose
#     manifest does not match the member's declared identity
#     (system / architecture / condition / lambda_pde / seed), is
#     EXCLUDED with an explicit reason.  It is never substituted.
#   * A member run that has no artifact, or an artifact whose evidence
#     state is not `valid`, makes the cohort incomplete.  The target is
#     then reported `not_run` or `incomplete_cohort` - never `met` -
#     or with the evidence state of the offending artifact
#     (`stale`, `invalid_protocol`, `failed`, `interrupted`) and NO
#     measured value.
#   * The verdict rule for a metric target is
#     `all_declared_members_must_satisfy`: every declared member (and
#     every declared seed) must satisfy the comparison.  The reported
#     `measured` value is the mean over the contributing runs, and the
#     note lists every contributing value.
#   * The inference targets are evaluated on the DECLARED reference run
#     only.  If it is missing the target fails explicitly; the best
#     available benchmark is never substituted for it.
#
# The evaluator sha256 below is the content identity of the evaluation
# implementation (src/pdelab/evaluation/{evaluate,metrics,rollout}.py
# plus src/pdelab/physics/operators.py).  It must be regenerated
# whenever any of those files changes, otherwise every artifact is
# reported as `invalid_protocol` (which is the intended behaviour: an
# artifact produced by a different evaluator is not comparable).

schema: pdelab-evidence-cohort/1
cohort_id: pdelab-main-confirmatory
description: >
  The confirmatory matrix of the study: the primary FNO architecture of
  each system, the data-only and the physics-regularized condition, and
  the three confirmatory training seeds declared in
  configs/hardware/atul_laptop.yaml.

evaluator:
  id: pdelab-evaluation/2
  sha256: "64c4841e3852f60753b3acdf9a43e29076b79dce45ffab3e59aa65ecf390f5c2"

protocol:
  id: pdelab-free-rollout/2
  split: test

datasets:
  burgers:
    system: burgers
    train_sha256: 10c74bcd0b15170a7b83aa631978e90e474d6256a621e5e58f60c5befb94f84f
    val_sha256: cb226883b9663d863e085134b42f2091843a902bc2d4b81bb841c4a316cfae6c
    test_sha256: b1ee09a87c905df335fa755dfd93aadb36a3c59c103c3cd3b943e290eb446e25
  allen_cahn:
    system: allen_cahn
    train_sha256: 3c764bfedbe4046e32add534e113103818333512be944c14c184c1ce3a8ef238
    val_sha256: 814d109e87528a68398382ef644ee153953387e8e3cee33509da4be58f9810fb
    test_sha256: 6ec8aca7f73021c9f0e17ccd9ba3a53799262c27a17cf636485f9a7abad5b3ae

members:
  - id: burgers_fno1d_data_only
    role: baseline
    system: burgers
    architecture: fno1d
    condition: data_only
    lambda_pde: 0.0
    seeds: [0, 1, 2]
    run_ids:
      - burgers_fno1d_data_only_seed0
      - burgers_fno1d_data_only_seed1
      - burgers_fno1d_data_only_seed2

  - id: burgers_fno1d_physics
    role: proposed
    system: burgers
    architecture: fno1d
    condition: physics
    lambda_pde: 0.01
    seeds: [0, 1, 2]
    run_ids:
      - burgers_fno1d_physics_seed0
      - burgers_fno1d_physics_seed1
      - burgers_fno1d_physics_seed2

  - id: allen_cahn_fno2d_data_only
    role: baseline
    system: allen_cahn
    architecture: fno2d
    condition: data_only
    lambda_pde: 0.0
    seeds: [0, 1, 2]
    run_ids:
      - allen_cahn_fno2d_data_only_seed0
      - allen_cahn_fno2d_data_only_seed1
      - allen_cahn_fno2d_data_only_seed2

  - id: allen_cahn_fno2d_physics
    role: proposed
    system: allen_cahn
    architecture: fno2d
    condition: physics
    lambda_pde: 0.01
    seeds: [0, 1, 2]
    run_ids:
      - allen_cahn_fno2d_physics_seed0
      - allen_cahn_fno2d_physics_seed1
      - allen_cahn_fno2d_physics_seed2

  - id: inference_reference
    role: inference_reference
    system: burgers
    architecture: fno1d
    condition: data_only
    lambda_pde: 0.0
    seeds: [0]
    run_ids:
      - burgers_fno1d_data_only_seed0

targets:
  - name: burgers_nrmse
    metric: nrmse
    members:
      - burgers_fno1d_data_only
      - burgers_fno1d_physics

  - name: allen_cahn_nrmse
    metric: nrmse
    members:
      - allen_cahn_fno2d_data_only
      - allen_cahn_fno2d_physics

  - name: burgers_residual_improvement
    metric: relative_residual_improvement
    baseline: burgers_fno1d_data_only
    proposed: burgers_fno1d_physics

  - name: allen_cahn_residual_improvement
    metric: relative_residual_improvement
    baseline: allen_cahn_fno2d_data_only
    proposed: allen_cahn_fno2d_physics

  - name: inference_throughput_ratio
    metric: throughput_ratio
    reference: burgers_fno1d_data_only_seed0

  - name: inference_memory_reduction
    metric: memory_reduction_percent
    reference: burgers_fno1d_data_only_seed0
