# System A: 1D viscous Burgers (periodic)
#
#   u_t + (u^2 / 2)_x = nu * u_xx
#
# Nondimensional units. Domain x in [0, 1), periodic, endpoint not
# duplicated. Length scale L = 1, time scale chosen so that the
# characteristic advection speed is O(1).
name: burgers
dimension: 1
solver: finite_volume_weno5_js
reference_solver: spectral_dealiased_strang
reference_grid: [256]
solver_grid: [256]
observation_grid: [128]
restriction: spectral_truncate_then_subsample
params:
  nu: 0.01
t_final: 0.5
observation_times: [0.0, 0.005, 0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045,
                    0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095,
                    0.1, 0.105, 0.11, 0.115, 0.12, 0.125, 0.13, 0.135, 0.14, 0.145,
                    0.15, 0.155, 0.16, 0.165, 0.17, 0.175, 0.18, 0.185, 0.19, 0.195,
                    0.2, 0.205, 0.21, 0.215, 0.22, 0.225, 0.23, 0.235, 0.24, 0.245,
                    0.25, 0.255, 0.26, 0.265, 0.27, 0.275, 0.28, 0.285, 0.29, 0.295,
                    0.3, 0.305, 0.31, 0.315, 0.32, 0.325, 0.33, 0.335, 0.34, 0.345,
                    0.35, 0.355, 0.36, 0.365, 0.37, 0.375, 0.38, 0.385, 0.39, 0.395,
                    0.4, 0.405, 0.41, 0.415, 0.42, 0.425, 0.43, 0.435, 0.44, 0.445,
                    0.45, 0.455, 0.46, 0.465, 0.47, 0.475, 0.48, 0.485, 0.49, 0.495,
                    0.5]
initial_condition:
  kind: fourier
  n_modes: 6
  amplitude: 0.9
  mean: 0.0
profiles:
  smoke:
    n_train: 4
    n_val: 2
    n_test: 2
    seed: 1000
    test_seed: 7001
  prototype:
    n_train: 64
    n_val: 16
    n_test: 16
    seed: 1000
    test_seed: 7001
  full:
    n_train: 512
    n_val: 64
    n_test: 64
    seed: 1000
    test_seed: 7001
