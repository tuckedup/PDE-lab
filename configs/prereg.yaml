# Pre-registration of the PDELab main study.
#
# The protocol below is frozen BEFORE the confirmatory (3-seed) matrix
# is executed. The confirmatory dataset is sized and frozen before its
# test results are examined. The prototype profile (1 seed) is
# exploratory and is reported separately.

frozen_on: "2026-10-19"
author: Atul Pandey

systems:
  - name: burgers
    equation: "u_t + (u^2/2)_x = nu * u_xx"
    nu: 0.01
    domain: "periodic [0, 1)"
    observation_grid: [128]
    reference_grid: [256]
    observation_dt: 0.005
    t_final: 0.5
  - name: allen_cahn
    equation: "u_t = D * (u_xx + u_yy) + a * (u - u^3)"
    D: 0.001
    a: 1.0
    domain: "periodic [0, 1) x [0, 1)"
    observation_grid: [32, 32]
    reference_grid: [64, 64]
    observation_dt: 0.05
    t_final: 1.0

main_conditions:
  - data-only FNO
  - physics-regularized FNO
  - data-only U-Net
  note: >
    A physics-regularized U-Net is a controlled optional extension and
    is additional work beyond the 18-run minimum matrix.

minimum_matrix:
  formula: "2 PDEs x 3 conditions x 3 training seeds = 18 runs"

shared_settings:
  optimizer: AdamW
  lr: 1.0e-3
  lr_schedule: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  batch_size_1d: 8
  batch_size_2d: 2
  selection_criterion: best validation loss (frozen before evaluation)
  seed_set: [0, 1, 2]
  note: >
    Identical trajectory splits, interface, training examples, optimizer
    family, stopping policy and validation schedule across conditions.
    Only lambda_pde differs between the data-only and the
    physics-regularized condition.

lambda_search:
  grid: [0.0, 0.01, 0.1]
  selection: validation split only
  budget: "one bounded search, identical access and budget per method"
  note: >
    The physics model is not tuned repeatedly against the test set.

# --- Amendment 1 (dated 2026-10-20), before the confirmatory seeds ---
# The selection *metric* is made explicit, because the grid alone does
# not determine the choice.
lambda_selection_rule:
  metric: "free-rollout nRMSE on the validation split"
  constraint: >
    A lambda is admissible if its validation rollout nRMSE is within 5%
    of the best lambda; among the admissible lambdas, select the one
    with the lowest validation PDE residual.
  rationale: >
    The study declares two objectives (accuracy and physics-residual
    consistency). A pure accuracy-only rule would discard the
    physics-regularized condition for Allen-Cahn, where the accuracy
    difference between the lambdas is 1.5% - far below the seed-to-seed
    spread - while the residual improvement is the quantity the study
    was designed to measure. The total validation loss is not
    comparable across lambda because the physics term contributes a
    different amount to it at each lambda. The one-step validation data
    loss is comparable but measures single-step accuracy, and it also
    selects lambda = 0, which is not a decision the pre-registration
    intended to make.
  recorded_selection: configs/lambda_selection.json
  both_selections_reported: true
  blind_with_respect_to_seed_0: false
  blindness_note: >
    The seed-0 test split was already examined during the prototype
    phase, so the selection is not fully blind with respect to seed 0.
    The confirmatory seeds 1 and 2 had not been examined at all when
    this rule was fixed.

ablations:
  selected:
    - no physics penalty vs the selected penalty
    - residual weight (lambda grid above)
    - one-step vs rollout horizon
    - spectral modes / model width at a fixed budget
    - correctness of residual gradients
  note: >
    A small justified subset, not an unbounded combinatorial sweep.

declared_limits:
  - "The target values in configs/targets.yaml are proposals, not guarantees."
  - "A failed target is a valid result and is reported as missed."
  - "The difficulty of a condition is never reduced to make a target pass."
