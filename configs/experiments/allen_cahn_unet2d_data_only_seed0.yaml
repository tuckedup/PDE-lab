# allen_cahn / unet2d / data_only (seed 0, lambda=0.0)
#
# Frozen v2 main-matrix row. The physics weight is the Arm-A selection
# from configs/lambda_selection.json (validation split only).
name: allen_cahn_unet2d_data_only_seed0
system: allen_cahn
condition: data_only
seed: 0
observation_dt: 0.1
lambda_pde: 0.0
tags: [main,v2]

model:
  architecture: unet2d
  history: 1
  width: 16
  n_levels: 3

data:
  dataset_dir: data/allen_cahn

train:
  epochs: 40
  batch_size: 2
  lr: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 100
  grad_clip: 1.0
  weight_decay: 0.0
  device: auto
  max_walltime_minutes: 45

profiles:
  smoke:
    epochs: 2
    batch_size: 2
    max_walltime_minutes: 5
  prototype:
    epochs: 40
    batch_size: 2
    max_walltime_minutes: 45
