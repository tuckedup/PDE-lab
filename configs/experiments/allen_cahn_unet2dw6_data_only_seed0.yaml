# allen_cahn / unet2d width 6 (near parameter-matched)
#
# Near parameter-matched U-Net. The pilot width-16 U-Net has ~8-10x the
# parameters of the FNO; this variant brings the counts close. It is a
# controlled ablation at a fixed budget, not a replacement for the
# practical-budget comparison.
name: allen_cahn_unet2dw6_data_only_seed0
system: allen_cahn
condition: data_only
seed: 0
observation_dt: 0.1
lambda_pde: 0.0
tags: [ablation, parameter_matched]

model:
  architecture: unet2d
  history: 1
  width: 6
  n_levels: 3

train:
  epochs: 40
  batch_size: 2
  lr: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 100
  grad_clip: 1.0
  weight_decay: 0.0
  device: auto
  max_walltime_minutes: 45

profiles:
  smoke:
    epochs: 2
    batch_size: 2
    max_walltime_minutes: 5
  prototype:
    epochs: 40
    batch_size: 2
    max_walltime_minutes: 45
