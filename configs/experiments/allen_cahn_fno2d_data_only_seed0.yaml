# allen_cahn / fno2d / data_only (seed 0)
name: allen_cahn_fno2d_data_only_seed0
system: allen_cahn
condition: data_only
seed: 0
observation_dt: 0.05
lambda_pde: 0.0
tags: [baseline,main]

model:
  architecture: fno2d
  history: 1
  modes_x: 8
  modes_y: 8
  width: 16
  n_layers: 4

train:
  epochs: 40
  batch_size: 2
  lr: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 100
  grad_clip: 1.0
  weight_decay: 0.0
  device: auto
  max_walltime_minutes: 45

profiles:
  smoke:
    epochs: 2
    batch_size: 2
    max_walltime_minutes: 5
  prototype:
    epochs: 40
    batch_size: 2
    max_walltime_minutes: 45
