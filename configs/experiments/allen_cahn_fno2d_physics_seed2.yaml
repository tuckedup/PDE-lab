# allen_cahn / fno2d / physics (seed 2, lambda=0.01)
#
# Frozen v2 main-matrix row. The physics weight is the Arm-A selection
# from configs/lambda_selection.json (validation split only).
name: allen_cahn_fno2d_physics_seed2
system: allen_cahn
condition: physics
seed: 2
observation_dt: 0.1
lambda_pde: 0.01
tags: [main,v2]

model:
  architecture: fno2d
  history: 1
  modes_x: 8
  modes_y: 8
  width: 16
  n_layers: 4

data:
  dataset_dir: data/allen_cahn

train:
  epochs: 40
  batch_size: 2
  lr: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 100
  grad_clip: 1.0
  weight_decay: 0.0
  device: auto
  max_walltime_minutes: 45

profiles:
  smoke:
    epochs: 2
    batch_size: 2
    max_walltime_minutes: 5
  prototype:
    epochs: 40
    batch_size: 2
    max_walltime_minutes: 45
