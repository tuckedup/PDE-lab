# allen_cahn / unet2d / data_only (seed 1, lambda=0.0)
name: allen_cahn_unet2d_data_only_seed1
system: allen_cahn
condition: data_only
seed: 1
observation_dt: 0.1
lambda_pde: 0.0
tags: [main]

model:
  architecture: unet2d
  history: 1
  width: 16
  n_levels: 3

train:
  epochs: 40
  batch_size: 2
  lr: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 100
  grad_clip: 1.0
  weight_decay: 0.0
  device: auto
  max_walltime_minutes: 45

profiles:
  smoke:
    epochs: 2
    batch_size: 2
    max_walltime_minutes: 5
  prototype:
    epochs: 40
    batch_size: 2
    max_walltime_minutes: 45
